<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
    
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>David A. Bednar</td>
            <td>The Spirit and Purposes of Gathering</td>
            <td>BYU-Idaho</td>
            <td>2006</td>
          </tr>
          <tr>
            <td>Henry B. Eyring</td>
            <td>Raise the Bar</td>
            <td>BYU-Idaho</td>
            <td>2005</td>
          </tr>
          <tr>
            <td>Dallin H. Oaks</td>
            <td>The Paradox of Love and Law</td>
            <td>BYU-Idaho</td>
            <td>2018</td>
          </tr>
        </table>

        <form>
          <label for="speaker">Speaker</label>
          <input type="text" id="speaker" name="speaker"> 

          <label for="title">Title</label>
          <input type="text" id="title" name="title">

          <label for="location">Location</label>
          <input type="text" id="location" name="location">

          <label for="year">Year</label>
          <input type="number" id="year" name="year" min="1900" max="2100">

          <button>Submit</button>
        </form>



      </div>
    </main>
  </div>
</body>
</html>
